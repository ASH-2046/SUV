[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "suv"
version = "0.1.0"
description = "SUV checkpoint inference and official NAVSIM evaluation"
requires-python = ">=3.10"
dependencies = [
  "einops==0.8.1",
  "huggingface-hub==0.29.2",
  "hydra-core==1.3.2",
  "modelscope==1.34.0",
  "numpy==1.26.4",
  "omegaconf==2.3.0",
  "pandas==2.2.3",
  "pillow==12.0.0",
  "regex==2025.11.3",
  "rich==14.2.0",
  "safetensors==0.5.3",
  "torch==2.7.1+cu128",
  "tqdm==4.66.5",
  "transformers==4.49.0",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["suv*"]
